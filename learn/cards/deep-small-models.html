<style>
  @font-face { font-family: Inter; font-weight: 400; src: url('../fonts/Inter-Regular.ttf'); }

  :root {

  .mark { position: absolute; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 32px; font-weight: 700; }
  .btn { position: absolute; background: var(--dark); color: #fff; font-size: 24px; font-weight: 700; padding: 12px 26px; border-radius: 14px; white-space: nowrap; }
  .step { position: absolute; width: 140px; height: 92px; border-radius: 16px; background: var(--card); border: 2px solid var(--line); display: grid; place-items: center; text-align: center; }
  .step .k { font-family: var(--mono); font-size: 26px; font-weight: 700; color: var(--goldText); }
  .step .w { font-size: 24px; font-weight: 700; }
  .card2 { position: absolute; border-radius: 20px; background: var(--card); border: 2px solid var(--line); }

<script>
const CH = [0, 4000, 10000, 18000, 24000, 31000, 38000, 45000, 51000, 56000];   // as in SCRIPTS.md
const T = 60000;
const OUT0 = T - 700, OUT1 = T - 150;
const $ = id => document.getElementById(id);
const end = i => (i + 1 < CH.length ? CH[i + 1] - 300 : OUT0);

function at(el, keys, easing = 'ease-out') {
  const frames = keys.map(([t, css]) => ({ offset: t / T, easing, ...css }));
  if (frames[0].offset > 0) frames.unshift({ ...keys[0][1], offset: 0 });
  if (frames[frames.length - 1].offset < 1) frames.push({ ...keys[keys.length - 1][1], offset: 1 });
  return el.animate(frames, { duration: T, iterations: Infinity, fill: 'both' });
}
const HIDE = { opacity: 0, transform: 'translateY(16px)' }, SHOW = { opacity: 1, transform: 'translateY(0)' };
function enter(el, t, dur = 500) { at(el, [[t, HIDE], [t + dur, SHOW], [OUT0, SHOW], [OUT1, { opacity: 0, transform: 'translateY(0)' }]]); }
function during(el, t, t1, dur = 500) {
  if (t1 - 250 <= t + dur) t1 = t + dur + 260;
  at(el, [[t, HIDE], [t + dur, SHOW], [t1 - 250, SHOW], [t1, { opacity: 0, transform: 'translateY(0)' }]]);
}
// chapter tags and lines (the first one is on screen at t = 0)
CH.forEach((t, i) => {
  const last = i === CH.length - 1, t1 = last ? OUT1 : end(i) + 300;
  const tg = $('tag' + i), sy = $('say' + i);
  if (i === 0) { at(tg, [[0, SHOW], [t1 - 250, SHOW], [t1, { opacity: 0 }]]); at(sy, [[0, SHOW], [t1 - 250, SHOW], [t1, { opacity: 0 }]]); return; }
  during(tg, t, t1); during(sy, t + 900, t1);
});

// ---- builders ------------------------------------------------------------------------------------------
const S = $('stage');
function el(cls, css, html = '', parent = S) { const d = document.createElement('div'); d.className = cls; d.style.cssText = css; d.innerHTML = html; parent.appendChild(d); return d; }
function tv(x, y, w, h, inner) { const t = el('tv', `left:${x}px;top:${y}px;width:${w}px;height:${h}px`); const s = el('scr', '', inner, t); return [t, s]; }
const MENU = `<div style="display:flex;gap:6px;padding:10px 10px 0">${['Home', 'Search', 'Guide', 'Settings'].map((w, i) =>
  `<span style="font-size:15px;font-weight:700;padding:3px 9px;border-radius:999px;${i === 0 ? 'background:#d4a574;color:#141414' : 'color:#ddd;border:1px solid #555'}">${w}</span>`).join('')}</div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 10px">${Array(8).fill('<i style="display:block;height:44px;border-radius:6px;background:#444"></i>').join('')}</div>`;
const VIDEO = `<div style="position:absolute;inset:0;background:linear-gradient(#5b7fa8,#9cb7cf 55%,#5f7d52 56%,#3f5a36)"></div>
  <div style="position:absolute;left:46%;top:36%;width:46px;height:46px;border-radius:50%;border:6px solid rgba(255,255,255,.35);border-top-color:#fff"></div>`;
function _unusedMoving(scr, t0, t1) {   // moving bars that stop at t1
  const b = el('o', 'left:0;top:0;bottom:0;width:200%;background:repeating-linear-gradient(90deg,#5b7fa8 0 40px,#9cb7cf 40px 80px,#3f5a36 80px 120px)', '', scr);
  at(b, [[t0, { transform: 'translateX(0)' }], [t1, { transform: 'translateX(-360px)' }]], 'linear');
}
function freezePill(x, y, t, t1) { const p = el('pill', `left:${x}px;top:${y}px`, 'FREEZE?'); at(p, [[t, { opacity: 0, transform: 'translateY(-24px)' }], [t + 350, { opacity: 1, transform: 'translateY(0)' }], [t1 - 250, { opacity: 1, transform: 'translateY(0)' }], [t1, { opacity: 0, transform: 'translateY(0)' }]], 'cubic-bezier(.3,1.6,.6,1)'); return p; }
function group(t, t1) { const g = el('o', 'inset:0'); at(g, [[t, { opacity: 0 }], [t + 400, { opacity: 1 }], [t1 - 300, { opacity: 1 }], [t1, { opacity: 0 }]]); return g; }
const gEl = (g, cls, css, html) => el(cls, css, html, g);


const CLOUD = '<svg width="120" height="84" viewBox="0 0 120 84"><path d="M30 76h62a24 24 0 0 0 2-48 32 32 0 0 0-61-6A26 26 0 0 0 30 76z" fill="#9a948b"/></svg>';
const CHIPICON = '<svg width="96" height="96" viewBox="0 0 96 96"><rect x="20" y="20" width="56" height="56" rx="10" fill="#1a1a1a"/><rect x="34" y="34" width="28" height="28" rx="4" fill="#d4a574"/>' +
  [28, 42, 56, 68].map(v => `<path d="M${v} 8v12M${v} 76v12M8 ${v}h12M76 ${v}h12" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>`).join('') + '</svg>';
const fly = (e, t, dx = -300, dy = 0) => at(e, [[t, { opacity: 0, transform: `translate(${dx}px,${dy}px) scale(.7)` }], [t + 600, { opacity: 1, transform: 'translate(0,0) scale(1)' }]]);
const pop = (e, t) => at(e, [[t, HIDE], [t + 500, SHOW]]);

// c0 · the question
{ const g = el('o', 'inset:0'); at(g, [[0, { opacity: 1 }], [CH[1] - 600, { opacity: 1 }], [CH[1] - 300, { opacity: 0 }]]);
  gEl(g, 'o', 'left:0;top:40px;font-size:64px;font-weight:700;letter-spacing:-1.5px', 'Ask the cloud every time?');
  gEl(g, 'o', 'left:250px;top:190px', CLOUD); gEl(g, 'o', 'left:560px;top:180px', CHIPICON);
  gEl(g, 'o', 'left:400px;top:210px;font-size:44px;font-weight:700;color:var(--goldText)', '→'); }

// c1 · three questions
{ const g = group(CH[1], CH[2]);
  const SEARCHTABS = `<div style="display:flex;gap:6px;padding:10px">${['A', 'B'].map(() => '<span style="width:70px;height:22px;border-radius:999px;border:1px solid #777"></span>').join('')}</div><div style="position:absolute;left:44%;top:40%;font-size:56px;font-weight:700;color:#d4a574">?</div>`;
  const NEW = `<div style="position:absolute;left:14px;top:14px;width:120px;height:26px;border-radius:8px;border:2px dashed #d4a574"></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:56px 12px 0">${Array(6).fill('<i style="display:block;height:34px;border-radius:6px;background:#555"></i>').join('')}</div>`;
  [[MENU, 'Menu or stuck video?'], [SEARCHTABS, 'Which screen is this?'], [NEW, 'What is it called?']].forEach(([inner, txt], i) => {
    const x = i * 316, [t] = tv(x, 10, 290, 172, inner); g.appendChild(t);
    const l = gEl(g, 'lbl', `left:${x}px;top:200px;font-size:26px`, txt);
    at(t, [[CH[1] + 300 + i * 1500, HIDE], [CH[1] + 800 + i * 1500, SHOW]]); at(l, [[CH[1] + 600 + i * 1500, HIDE], [CH[1] + 1100 + i * 1500, SHOW]]); });
  g.appendChild(freezePill(200, -4, CH[1] + 900, CH[2])); }

// c2 · the six steps
{ const g = group(CH[2], CH[3]);
  const line = gEl(g, 'o', 'left:70px;top:114px;height:4px;background:var(--gold);width:0');
  at(line, [[CH[2] + 400, { width: '0px' }], [CH[2] + 5400, { width: '796px' }]], 'linear');
  ['Data', 'Test set', 'Teacher', 'Train', 'Replay', 'Serve'].forEach((w, i) => {
    const s = gEl(g, 'step', `left:${i * 160}px;top:70px`, `<div><div class="k">${i + 1}</div><div class="w">${w}</div></div>`);
    at(s, [[CH[2] + 400 + i * 900, { opacity: .25, borderColor: '#d9d4cc' }], [CH[2] + 800 + i * 900, { opacity: 1, borderColor: '#d4a574' }]]); }); }

// c3 · a teacher, not a person
{ const g = group(CH[3], CH[4]);
  const c = gEl(g, 'darkc', 'left:0;top:10px;width:340px;height:190px');
  el('o', 'left:24px;top:20px', CLOUD.replace('#9a948b', '#d4a574'), c);
  el('o', 'left:24px;top:124px;font-size:26px;font-weight:700', 'Teacher: Haiku, Sonnet', c);
  const m = gEl(g, 'o', 'left:560px;top:40px', CHIPICON);
  for (let i = 0; i < 5; i++) { const a = gEl(g, 'o', `left:${370 + (i % 3) * 52}px;top:${60 + i * 22}px;width:40px;height:16px;border-radius:8px;background:var(--gold)`);
    at(a, [[CH[3] + 600 + i * 500, { opacity: 0, transform: 'translateX(-60px)' }], [CH[3] + 900 + i * 500, { opacity: 1, transform: 'translateX(0)' }], [CH[3] + 1500 + i * 500, { opacity: 0, transform: 'translateX(220px)' }]]); }
  const tb = gEl(g, 'card2', 'left:0;top:230px;width:936px;height:70px');
  el('o', 'left:24px;top:18px;font-size:26px;font-weight:700', 'Judges: Sonnet + Opus', tb);
  el('o', 'right:24px;top:14px', '<svg width="40" height="40" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2" fill="#1a1a1a"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="#1a1a1a" stroke-width="2.4" fill="none"/></svg>', tb);
  pop(tb, CH[3] + 3200); pop(m, CH[3] + 300); }

// c4 · freeze word classifier
{ const g = group(CH[4], CH[5]); const [t] = tv(0, 10, 330, 196, MENU); g.appendChild(t);
  for (let i = 0; i < 8; i++) { const p = gEl(g, 'chip mono m', `left:${370 + (i % 4) * 70}px;top:${20 + Math.floor(i / 4) * 56}px;width:56px;height:40px;padding:0`, '');
    at(p, [[CH[4] + 500 + i * 180, { opacity: 0, transform: 'translateX(-200px) scale(.6)' }], [CH[4] + 900 + i * 180, { opacity: 1, transform: 'translateX(0) scale(1)' }]]); }
  const b = gEl(g, 'bar', 'left:370px;top:150px;width:330px'); const f = el('fill', 'width:0', '', b);
  at(f, [[CH[4] + 2200, { width: '0%' }], [CH[4] + 3200, { width: '95%' }]]);
  const d = gEl(g, 'res', 'left:730px;top:140px', '<span class="p" style="color:var(--menu);border-color:var(--menu);background:var(--menuBg)">Discard</span>'); pop(d, CH[4] + 3300);
  [['2 MB', 0], ['0.25 ms', 170], ['95.6 to 99.2 %', 380], ['Every night', 660]].forEach(([w, x], i) => { const c = gEl(g, 'chip', `left:${x}px;top:250px`, w); pop(c, CH[4] + 3800 + i * 400); }); }

// c5 · Localize model
{ const g = group(CH[5], CH[6]);
  const pc = gEl(g, 'card2', 'left:0;top:0;width:330px;height:220px;overflow:hidden;transform-origin:top left');
  for (let i = 0; i < 9; i++) el('o', `left:20px;top:${18 + i * 22}px;height:10px;border-radius:5px;background:#d9d4cc;width:${220 + (i * 37) % 70}px`, '', pc);
  at(pc, [[CH[5] + 800, { height: '220px' }], [CH[5] + 2000, { height: '76px' }]]);
  const clk = gEl(g, 'big', 'left:380px;top:20px;color:var(--ink)', '<span id="clock">11 s</span>');
  const ans = gEl(g, 'chip m', 'left:380px;top:110px', 'home'); pop(ans, CH[5] + 3000);
  [['640 MB', 0], ['770 → 240 tokens', 170], ['11 s → 1.3 s', 450], ['98.9 %', 690]].forEach(([w, x], i) => { const c = gEl(g, 'chip', `left:${x}px;top:250px`, w); pop(c, CH[5] + 3400 + i * 400); }); }

// c6 · screen namer
{ const g = group(CH[6], CH[7]);
  const NEW = `<div style="position:absolute;left:14px;top:14px;width:120px;height:26px;border-radius:8px;border:2px dashed #d4a574"></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:56px 12px 0">${Array(6).fill('<i style="display:block;height:34px;border-radius:6px;background:#555"></i>').join('')}</div>`;
  const [t] = tv(0, 10, 300, 180, NEW); g.appendChild(t);
  const m = gEl(g, 'o', 'left:330px;top:40px', CHIPICON); pop(m, CH[6] + 500);
  ['kind: home', 'app: launcher', 'name: home'].forEach((w, i) => { const c = gEl(g, 'chip mono m', `left:470px;top:${14 + i * 62}px`, w); fly(c, CH[6] + 1300 + i * 600, -120); });
  [['365 MB', 0], ['4.7 s', 170]].forEach(([w, x], i) => { const c = gEl(g, 'chip', `left:${x}px;top:250px`, w); pop(c, CH[6] + 3400 + i * 400); }); }

// c7 · only when sure
{ const g = group(CH[7], CH[8]); const X = 0, W = 560;
  const b = gEl(g, 'bar', `left:${X}px;top:20px;width:${W}px`); el('o', 'left:90%;top:0;bottom:0;right:0;background:var(--menuBg)', '', b);
  gEl(g, 'tick', `left:${X + 0.9 * W - 1}px;top:12px;height:42px`); gEl(g, 'line', `left:${X + 0.9 * W - 18}px;top:58px;font-family:var(--mono);font-size:20px`, '0.9');
  const sure = gEl(g, 'res', 'left:0;top:110px', '<span class="p" style="color:var(--menu);border-color:var(--menu);background:var(--menuBg)">Sure: answered</span>');
  const uns = gEl(g, 'res', 'left:0;top:180px', '<span class="p" style="color:var(--warn);border-color:var(--warn);background:var(--warnBg)">Unsure: the cloud model</span>');
  pop(sure, CH[7] + 900); pop(uns, CH[7] + 1700);
  const cl = gEl(g, 'o', 'left:420px;top:160px', CLOUD); pop(cl, CH[7] + 1700);
  const st = gEl(g, 'o', 'left:300px;top:96px;font-family:var(--mono);font-size:20px;font-weight:700;color:var(--goldText);border:2px solid var(--goldText);border-radius:8px;padding:2px 8px;transform:rotate(-8deg)', '5 %'); pop(st, CH[7] + 2400);
  [['94 % on all screens', 590, 40], ['98 % on the 84 % it is sure of', 590, 110]].forEach(([w, x, y], i) => { const l = gEl(g, 'lbl', `left:${x}px;top:${y}px;font-size:26px;${i ? 'color:var(--goldText)' : 'color:var(--muted)'}`, w); pop(l, CH[7] + 3000 + i * 800); }); }

// c8 · better labels, not bigger
{ const g = group(CH[8], CH[9]);
  [0, 1, 2].forEach(i => { const s = gEl(g, 'o', `left:${i * 130}px;top:${200 - i * 60}px;width:120px;height:${60 + i * 60}px;border-radius:12px 12px 0 0;background:var(--gold)`); pop(s, CH[8] + 400 + i * 400); });
  const big = gEl(g, 'card2', 'left:470px;top:30px;width:180px;height:180px;display:grid;place-items:center', CHIPICON.replace('width="96" height="96"', 'width="140" height="140"'));
  el('o', 'left:-10px;top:84px;width:200px;height:8px;background:var(--bad);border-radius:4px;transform:rotate(-35deg)', '', big); pop(big, CH[8] + 1800);
  [['Own mistakes, judged by Opus', 0, 280], ['500M not better than 256M', 470, 230]].forEach(([w, x, y], i) => { const l = gEl(g, 'lbl', `left:${x}px;top:${y}px;font-size:26px`, w); pop(l, CH[8] + 2400 + i * 700); }); }

// c9 · small, fast, free
{ const g = group(CH[9], T);
  [0, 1, 2].forEach(i => { const m = gEl(g, 'o', `left:${200 + i * 200}px;top:0`, CHIPICON); pop(m, CH[9] + i * 300); });
  gEl(g, 'o', 'left:0;right:0;top:120px;text-align:center;font-family:var(--mono);font-size:40px;font-weight:700;color:var(--goldText)', '0.25 ms · 1.3 s · 4.7 s');
  gEl(g, 'o', 'left:0;right:0;top:190px;text-align:center;font-size:30px;font-weight:700', '0 USD a call');
  gEl(g, 'o', 'left:0;right:0;top:250px;display:flex;justify-content:center', '<span class="btn" style="position:static">See the poster →</span>'); }

// counter: the 11 s -> 1.3 s clock of chapter 5
function tick(ms) { const c = $('clock'); if (!c) return; const k = Math.max(0, Math.min(1, (ms - CH[5] - 800) / 1200)); c.textContent = k < 1 ? (11 - k * 9.7).toFixed(0) + ' s' : '1.3 s'; }
