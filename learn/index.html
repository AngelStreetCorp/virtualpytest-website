<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learn VirtualPyTest</title>
<meta name="description" content="Learn VirtualPyTest step by step: short animated lessons on controlling devices, mapping your app, checking screens, testing and monitoring.">
<link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png">
<!-- The Learn player. Each step is a concept card (cards/<name>.html, made in the product repo under
     scripts/promo/concepts/, copied here by publish_learn.sh) shown in its ?f=embed view: the diagram only.
     Cards are same-origin, so the player drives their Web Animations directly: play, pause, slow, replay, and it
     holds the last frame instead of looping. Topics and steps are the TOPICS data below. -->
<style>
  @font-face { font-family: Inter; font-weight: 400; src: url('fonts/Inter-Regular.ttf'); font-display: swap; }
  @font-face { font-family: Inter; font-weight: 700; src: url('fonts/Inter-Bold.ttf'); font-display: swap; }
  :root {
    --bg: #f2f0ec; --panel: #ffffff; --stage: #e9e5de; --line: #d9d4cc; --ink: #141414; --ink2: #4a4a4a;
    --muted: #6e6e6e; --gold: #d4a574; --goldText: #8f5f2e; --dark: #1a1a1a; --onDark: #ffffff; --ok: #16a34a;
    --chipOn: #1a1a1a; --chipOnInk: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141312; --panel: #1d1c1a; --stage: #262421; --line: #34312c; --ink: #f1ede6; --ink2: #cfc9bf;
      --muted: #9a948a; --goldText: #e0b183; --dark: #f1ede6; --onDark: #141312; --chipOn: #d4a574; --chipOnInk: #141312;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141312; --panel: #1d1c1a; --stage: #262421; --line: #34312c; --ink: #f1ede6; --ink2: #cfc9bf;
    --muted: #9a948a; --goldText: #e0b183; --dark: #f1ede6; --onDark: #141312; --chipOn: #d4a574; --chipOnInk: #141312;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); }
  body { font-family: Inter, system-ui, -apple-system, sans-serif; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 8px; }

  /* top bar: brand + the topics */
  header { display: flex; align-items: center; gap: 20px; padding: 14px 24px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; flex-shrink: 0; }
  .brand .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--gold); display: grid; place-items: center; }
  .brand b { font-size: 17px; letter-spacing: -0.3px; }
  .brand small { display: block; font-size: 13px; color: var(--muted); }
  nav.topics { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
  nav.topics::-webkit-scrollbar { display: none; }
  nav.topics button { flex-shrink: 0; padding: 8px 12px; border-radius: 999px; font-size: 14px; color: var(--ink2); white-space: nowrap; border: 1px solid transparent; }
  nav.topics button:hover { border-color: var(--line); }
  nav.topics button[aria-current="true"] { background: var(--chipOn); color: var(--chipOnInk); font-weight: 700; }
  nav.topics button .n { opacity: .6; margin-right: 6px; }
  nav.topics button .soon { font-size: 11px; opacity: .75; margin-left: 6px; }

  /* body: stage + side panel */
  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 20px; padding: 20px 24px 24px; min-height: 0; }
  /* the stage is always the cards' own light background, also in dark mode: the cards are light */
  .stage { position: relative; background: #f2f0ec; border: 1px solid var(--line); border-radius: 22px; overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 320px; padding: 70px 0; }
  .stage .num { position: absolute; left: 26px; top: 14px; font-size: 76px; font-weight: 700; letter-spacing: -3px; line-height: 1; color: #141414; z-index: 2; }
  .stage .fit { position: relative; width: 100%; }
  .stage iframe { position: absolute; left: 0; top: 0; width: 1080px; height: 600px; border: 0; transform-origin: 0 0; }
  .controls { position: absolute; left: 18px; bottom: 16px; display: flex; gap: 8px; z-index: 2; }
  .controls button { height: 44px; min-width: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #d9d4cc; background: #fff; color: #141414; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; }
  .controls button[aria-pressed="true"] { background: var(--chipOn); color: var(--chipOnInk); border-color: var(--chipOn); }
  .controls button.pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(212,165,116,.4); } }
  .soonbox { padding: 24px 32px; color: #4a4a4a; max-width: 520px; }
  .soonbox h2 { font-size: 26px; color: #141414; }
  .soonbox p { margin-top: 6px; color: var(--muted); }
  .soonbox ol { margin: 18px 0 0 22px; line-height: 1.9; font-size: 16px; }

  aside.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; display: flex; flex-direction: column; min-height: 0; }
  .panel .body { padding: 26px 26px 18px; overflow-y: auto; flex: 1; }
  .meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
  .meta .left { border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
  .panel h1 { margin-top: 14px; font-size: 30px; line-height: 1.12; letter-spacing: -0.8px; }
  .panel .l2 { margin-top: 8px; font-family: Georgia, 'DejaVu Serif', serif; color: var(--goldText); font-size: 22px; line-height: 1.25; }
  .panel p.text { margin-top: 14px; font-size: 16px; line-height: 1.5; color: var(--ink2); }
  .panel h3 { margin-top: 24px; font-size: 14px; color: var(--muted); font-weight: 700; }
  .needs { margin-top: 10px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .needs .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; font-size: 15px; width: 100%; text-align: left; }
  .needs .row + .row { border-top: 1px solid var(--line); }
  .needs .row .tag { font-size: 12px; font-weight: 700; color: var(--muted); min-width: 30px; }
  .needs .row .st { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .needs .row .st.done { color: var(--ok); }
  .upnext { margin-top: 10px; display: flex; align-items: center; gap: 12px; width: 100%; padding: 16px; border-radius: 14px; background: var(--stage); font-size: 16px; font-weight: 700; text-align: left; }
  .upnext .n { font-size: 20px; }
  .upnext small { font-weight: 400; color: var(--muted); }
  .upnext .arr { margin-left: auto; }
  .keys { margin-top: 18px; font-size: 13px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
  .keys kbd { font: inherit; font-weight: 700; color: var(--ink2); }
  .foot { display: flex; gap: 10px; padding: 14px; border-top: 1px solid var(--line); }
  .foot .back { width: 52px; height: 52px; border-radius: 999px; border: 1px solid var(--line); display: grid; place-items: center; flex-shrink: 0; }
  .foot .done { flex: 1; height: 52px; border-radius: 999px; background: var(--dark); color: var(--onDark); display: flex; align-items: center; gap: 12px; padding: 0 18px; font-size: 17px; font-weight: 700; }
  .foot .done .tick { width: 26px; height: 26px; border-radius: 50%; background: var(--gold); display: grid; place-items: center; }
  .foot .done .arr { margin-left: auto; }
  .foot button:disabled { opacity: .35; cursor: default; }

  /* phone: stage on top, the text under it, the step buttons pinned at the bottom */
  @media (max-width: 900px) {
    header { padding: 10px 16px; gap: 10px; flex-wrap: wrap; }
    nav.topics { order: 3; flex-basis: 100%; margin: 0 -16px; padding: 0 16px; }
    main { grid-template-columns: 1fr; padding: 12px 16px 0; gap: 14px; }
    .stage { min-height: 0; border-radius: 16px; padding: 52px 0 62px; }
    .stage .num { font-size: 40px; left: 16px; top: 10px; letter-spacing: -2px; }
    .controls { left: 12px; bottom: 10px; }
    .controls button { height: 40px; min-width: 40px; }
    aside.panel { border: 0; background: transparent; border-radius: 0; }
    .panel .body { padding: 0 0 16px; overflow: visible; }
    .panel h1 { font-size: 26px; }
    .panel .l2 { font-size: 20px; }
    .keys { display: none; }
    .foot { position: sticky; bottom: 0; margin: 0 -16px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--bg); }
  }
</style>
</head>
<body>
<header>
  <a class="brand" href="../">
    <span class="mark"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="#141414"/></svg></span>
    <span><b>VirtualPyTest</b><small>Learn</small></span>
  </a>
  <nav class="topics" id="topics" aria-label="Topics"></nav>
</header>
<main>
  <section class="stage" id="stage" aria-label="Animation">
    <div class="num" id="num" aria-hidden="true"></div>
    <div class="fit" id="fit"><iframe id="card" title="Animated lesson" scrolling="no"></iframe></div>
    <div class="soonbox" id="soon" hidden></div>
    <div class="controls" id="controls">
      <button id="bReplay" aria-label="Replay"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
      <button id="bPause" aria-label="Pause"></button>
      <button id="bSlow" aria-pressed="false">Slow</button>
    </div>
  </section>
  <aside class="panel" aria-live="polite">
    <div class="body">
      <div class="meta"><span id="stepOf"></span><span class="left" id="left"></span></div>
      <h1 id="title"></h1>
      <div class="l2" id="sub"></div>
      <p class="text" id="text"></p>
      <h3 id="needsH">Before this</h3>
      <div class="needs" id="needs"></div>
      <h3 id="upH">Up next</h3>
      <button class="upnext" id="upnext"></button>
      <div class="keys"><span><kbd>←</kbd> <kbd>→</kbd> to move</span><span><kbd>R</kbd> to replay</span><span><kbd>Space</kbd> to pause</span></div>
    </div>
    <div class="foot">
      <button class="back" id="bBack" aria-label="Previous step"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <button class="done" id="bNext"><span class="tick"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#141414" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span id="nextLbl">Done, next step</span><span class="arr" aria-hidden="true">→</span></button>
    </div>
  </aside>
</main>
<script>
// Topics of the course (scripts/promo/concepts/LEARN_TREE.md in the product repo). `cards` = published steps;
// a topic without cards lists its planned lessons. `need` = step ids to know first, "<topic>.<step>".
const TOPICS = [
  { id: 1, name: 'Control any device', plan: ['See your devices live', 'The right remote for each device', 'Add your own phone', 'Add phones from the cloud', 'More than TVs and phones'] },
  { id: 2, name: 'User interface', cards: [
    { card: 'user-interface', title: 'Map your app once', sub: 'Every test reuses the same screens and keys',
      text: 'The user interface is a map of your app: its screens and the keys that move between them. You map it once; every test reuses it.',
      need: ['1.1'] },
    { card: 'go-anywhere', title: 'Just name the screen', sub: 'We find the shortest way and press the keys',
      text: 'Your test only names the screen. VirtualPyTest reads the map, finds the shortest way from where the device is, and presses the keys.',
      need: ['2.1'] },
    { card: 'variants', title: 'Many models, one map', sub: 'Add only what differs; the same test runs on all',
      text: 'A named variant keeps only what differs on one model, like a key. Everything else comes from the same map, and the test does not change.',
      need: ['2.1', '2.2'] },
    { card: 'repair-map', title: 'Your app changed?', sub: 'Fix one move on the map; every test follows',
      text: 'When an update moves a screen, one move in the map breaks. Fix it there once, and every test that goes through it follows.',
      need: ['2.1'] },
  ] },
  { id: 3, name: 'UI verification', plan: ['Be sure you reached the screen', 'Save a picture or a word once', 'Fingerprint: why', 'Fingerprint: how', 'Fingerprint: fast', 'Fingerprint: set once', 'Fingerprint: Localize'] },
  { id: 4, name: 'Write tests', plan: ['Build a test without code', 'Need loops or conditions?', 'Prompt Testing with AI', 'Run your tests every night'] },
  { id: 5, name: 'Measure', plan: ['How fast does your app answer?', 'Shown is not loaded', 'How long does a zap take?', 'Every run, proof you can check'] },
  { id: 6, name: 'Monitor 24/7', plan: ['Your devices, watched 24/7', 'Is the picture any good?', 'Your whole fleet at a glance', 'It broke at 3 a.m.?'] },
  { id: 7, name: 'AI in the lab', plan: ['Talk to your lab', 'Fewer false alarms', 'A test failed. Real bug?'] },
  { id: 8, name: 'Run the lab', plan: ['Follow your project', 'Your whole lab on one page', 'One lab, many teams', 'Every result, kept and charted'] },
  { id: 9, name: 'More features', plan: ['Fly a drone from your browser', 'Play a Nintendo Switch remotely', 'A bot that plays Tetris', 'The page opens beside the chat'] },
];
const START = 1200;            // the diagram starts at 1.6 s: skip the social loop's empty header time
const STEP_S = 12;             // seconds one step plays, for "min left"
const $ = id => document.getElementById(id);
const stepTitle = (t, n) => (t.cards ? t.cards[n - 1]?.title : t.plan?.[n - 1]) || '';
const steps = t => (t.cards || t.plan).length;

// progress: per viewer, in this browser only
const store = {
  get() { try { return JSON.parse(localStorage.getItem('vpt-learn-done') || '{}'); } catch { return {}; } },
  mark(id) { try { const d = store.get(); d[id] = 1; localStorage.setItem('vpt-learn-done', JSON.stringify(d)); } catch {} },
};

let topic = TOPICS[1], step = 1, rate = 1, paused = false, ended = false;

function renderTopics() {
  const nav = $('topics'); nav.innerHTML = '';
  TOPICS.forEach(t => {
    const b = document.createElement('button');
    b.innerHTML = `<span class="n">${t.id}</span>${t.name}${t.cards ? '' : '<span class="soon">soon</span>'}`;
    b.setAttribute('aria-current', t === topic ? 'true' : 'false');
    b.onclick = () => go(t, 1);
    nav.appendChild(b);
  });
  const cur = nav.querySelector('[aria-current="true"]');
  if (cur) nav.scrollTo({ left: cur.offsetLeft - nav.clientWidth / 2 + cur.offsetWidth / 2 });
}

function go(t, n) {
  topic = t; step = n;
  history.replaceState(null, '', `#${t.id}.${n}`);
  renderTopics();
  const live = !!t.cards, total = steps(t);
  $('fit').hidden = $('controls').hidden = !live; $('soon').hidden = live;
  $('num').textContent = live ? n : '';
  $('stepOf').textContent = live ? `Step ${n} of ${total}` : `Topic ${t.id} · ${total} lessons`;
  $('left').textContent = live ? `≈ ${Math.max(1, Math.ceil((total - n + 1) * STEP_S / 60))} min left` : 'Coming soon';
  if (!live) {
    frame.src = 'about:blank';
    $('title').textContent = t.name; $('sub').textContent = 'Coming soon';
    $('text').textContent = 'These lessons are being made. Here is what this topic will teach.';
    $('soon').innerHTML = `<h2>${t.name}</h2><p>Coming soon</p><ol>${t.plan.map(p => `<li>${p}</li>`).join('')}</ol>`;
    $('needsH').hidden = $('needs').hidden = true;
    return setNext();
  }
  const s = t.cards[n - 1], done = store.get(), needs = $('needs');
  $('title').textContent = s.title; $('sub').textContent = s.sub; $('text').textContent = s.text;
  needs.innerHTML = '';
  $('needsH').hidden = needs.hidden = !s.need.length;
  s.need.forEach(id => {
    const [ti, si] = id.split('.').map(Number), tt = TOPICS.find(x => x.id === ti);
    const row = document.createElement('button'); row.className = 'row';
    const st = done[id] ? '<span class="st done">✓ Done</span>' : tt.cards ? '' : '<span class="st">soon</span>';
    row.innerHTML = `<span class="tag">${id}</span>${stepTitle(tt, si)}${st}`;
    row.onclick = () => go(tt, si);
    needs.appendChild(row);
  });
  setNext();
  load(s.card);
}

function nextOf() {
  if (step < steps(topic) && topic.cards) return [topic, step + 1];
  const i = TOPICS.indexOf(topic);
  return i < TOPICS.length - 1 ? [TOPICS[i + 1], 1] : null;
}
function setNext() {
  const nx = nextOf(), up = $('upnext');
  up.hidden = $('upH').hidden = !nx;
  if (nx) {
    const [t, n] = nx;
    up.innerHTML = `<span class="n">${t === topic ? n : t.id + '.' + n}</span><span>${stepTitle(t, n)}${t.cards ? '' : ' <small>soon</small>'}</span><span class="arr" aria-hidden="true">→</span>`;
    up.onclick = () => go(t, n);
  }
  $('bNext').disabled = !nx;
  $('nextLbl').textContent = topic.cards ? 'Done, next step' : 'Next topic';
  $('bBack').disabled = topic === TOPICS[0] && step === 1;
}

// the card: a same-origin iframe in its embed view (1080 x 600), scaled to the stage width
const frame = $('card');
function fit() { const k = $('fit').clientWidth / 1080; frame.style.transform = `scale(${k})`; $('fit').style.height = 600 * k + 'px'; }
new ResizeObserver(fit).observe($('fit'));
const win = () => { try { return frame.contentWindow.__T ? frame.contentWindow : null; } catch { return null; } };
const anims = () => win()?.document.getAnimations() || [];
function load(name) {
  ended = false; paused = false; setPause();
  frame.onload = () => { seek(START); play(); };
  frame.src = `cards/${name}.html?f=embed`;
}
function seek(ms) { win()?.__seek(ms); }
function play() { anims().forEach(a => { a.playbackRate = rate; a.play(); }); paused = ended = false; setPause(); }
function pause() { anims().forEach(a => a.pause()); paused = true; setPause(); }
function replay() { seek(START); play(); }
function setPause() {
  const b = $('bPause');
  b.setAttribute('aria-label', paused ? 'Play' : 'Pause');
  b.innerHTML = paused
    ? '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5l12 7-12 7z" fill="currentColor"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>';
  $('bReplay').classList.toggle('pulse', ended);
}
// hold on the last state: the social loop fades out at T - 1000, so stop just before it
(function watch() {
  const w = win(), a = anims()[0];
  if (w && a && !paused && a.currentTime % w.__T >= w.__T - 1100) {
    pause(); seek(w.__T - 1100); ended = true; setPause();
    store.mark(`${topic.id}.${step}`);
  }
  requestAnimationFrame(watch);
})();

$('bReplay').onclick = replay;
$('bPause').onclick = () => (ended ? replay() : paused ? play() : pause());
$('bSlow').onclick = () => { rate = rate === 1 ? 0.5 : 1; $('bSlow').setAttribute('aria-pressed', String(rate !== 1)); if (!paused) play(); };
$('bNext').onclick = () => { if (topic.cards) store.mark(`${topic.id}.${step}`); const nx = nextOf(); if (nx) go(...nx); };
$('bBack').onclick = () => {
  if (step > 1) return go(topic, step - 1);
  const i = TOPICS.indexOf(topic); if (i > 0) { const t = TOPICS[i - 1]; go(t, t.cards ? steps(t) : 1); }
};
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowRight') $('bNext').click();
  else if (e.key === 'ArrowLeft') $('bBack').click();
  else if (e.key === 'r' || e.key === 'R') replay();
  else if (e.key === ' ') { e.preventDefault(); $('bPause').click(); }
});

// deep link: #2.3 = topic 2, step 3 (also when only the hash changes)
function fromHash() {
  const m = location.hash.match(/^#(\d+)\.(\d+)$/), t0 = m && TOPICS.find(t => t.id === +m[1]);
  const n = t0 ? Math.max(1, Math.min(+m[2], steps(t0))) : 1;
  if (t0 !== topic || n !== step || !frame.src) go(t0 || TOPICS[1], n);
}
window.addEventListener('hashchange', fromHash);
fromHash();
</script>
</body>
</html>
