<style>
:root{--bg:#161616;--bar:rgba(22,22,22,.86);--text:#f2f2f2;--border:#3a3a3a;--hover:#2a2a2a;--gold:#e0a96d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Geist,system-ui,-apple-system,"Segoe UI",sans-serif}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--bar);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.top .grp{display:flex;gap:8px;align-items:center}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:40px;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);font:600 14px/20px inherit;text-decoration:none;cursor:pointer}
.ib:hover{background:var(--hover)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:16;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib svg.f{fill:currentColor;stroke:none}
main{display:flex;justify-content:center;padding:24px 16px 64px}
main img{display:block;width:100%;max-width:820px;height:auto;border-radius:16px;border:1px solid var(--border)}
@media (max-width:520px){.ib .t{display:none}.ib.back{padding:0 12px}}
</style>

<script>
var P = {
  'what-is': {title: 'What is VirtualPyTest?', src: '../img/what-is-virtualpytest.svg', alt: 'One vertical image: devices, control, the navigation map, screen checks, runs and KPIs, 24/7 monitoring, and the AI on top.'},
  'profiles': {title: 'A profile is a set of services', src: '../img/profiles.svg', alt: 'One vertical image: the three host shapes, a profile for each device, a table of what each profile runs, one setting per device, a real case of paying for what you run, and what to keep.'},
